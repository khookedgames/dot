<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  /* DARK MODE (default) */
  :root {
    --bg: #2A2A2A;
    --card: #363636;
    --card-2: #424242;
    --text: #F5F5F5;
    --text-soft: #A8A8A8;
    --accent: #EF4444;
    --accent-dark: #B91C1C;
    --accent-light: #4A1F1F;
    --border: #DC2626;
    --border-soft: #7F1D1D;
    --bubble-mine: #DC2626;
    --bubble-mine-text: #FFFFFF;
    --bubble-theirs: #4A4A4A;
    --bubble-theirs-text: #F5F5F5;
    --chat-bg: #1F1F1F;
    --shadow-strong: 0 12px 32px rgba(0,0,0,0.5);
    --danger: #EF4444;
    --input-bg: #2A2A2A;
    --hover: #424242;
    --section-bg: #2F2F2F;
  }
  
  /* LIGHT MODE */
  [data-theme="light"] {
    --bg: #FFE4D6;
    --card: #FFF5EE;
    --card-2: #FFFFFF;
    --text: #2D1410;
    --text-soft: #8B5A4F;
    --accent: #DC2626;
    --accent-dark: #991B1B;
    --accent-light: #FEE2E2;
    --border: #DC2626;
    --border-soft: #FCA5A5;
    --bubble-mine: #DC2626;
    --bubble-mine-text: #FFFFFF;
    --bubble-theirs: #FFFFFF;
    --bubble-theirs-text: #2D1410;
    --chat-bg: #F5C6B0;
    --shadow-strong: 0 12px 32px rgba(220, 38, 38, 0.18);
    --danger: #B91C1C;
    --input-bg: #FFFFFF;
    --hover: #FFE0D0;
    --section-bg: #FFEEDF;
  }
  
  html, body {
    height: 100%;
    font-family: 'Hiragino Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s, color 0.2s;
  }
  
  #app {
    height: 100vh;
    height: 100dvh;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  
  /* AUTH */
  .auth-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(20px, 5vh, 32px) 20px;
    background: linear-gradient(180deg, #DC2626 0%, #7F1D1D 100%);
    color: white;
    overflow-y: auto;
  }
  .logo {
    width: 72px; height: 72px;
    border-radius: 50%; background: white;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.3);
    border: 3px solid #FCA5A5;
    flex-shrink: 0;
  }
  .logo::after {
    content: ''; width: 24px; height: 24px;
    border-radius: 50%; background: #DC2626;
  }
  .brand { font-size: 30px; font-weight: 800; letter-spacing: -1px; }
  .tagline { font-size: 13px; opacity: 0.9; margin: 4px 0 24px; }
  .auth-card {
    background: var(--card); border-radius: 18px;
    padding: 22px 20px; width: 100%; max-width: 360px;
    box-shadow: var(--shadow-strong); color: var(--text);
    border: 2px solid var(--border);
  }
  .auth-tabs {
    display: flex; background: var(--bg);
    border-radius: 12px; padding: 4px; margin-bottom: 20px;
    border: 1px solid var(--border-soft);
  }
  .auth-tab {
    flex: 1; padding: 9px;
    border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; color: var(--text-soft);
    border: none; background: transparent; font-family: inherit;
    transition: all 0.2s;
  }
  .auth-tab.active { background: var(--accent); color: white; }
  
  .field { margin-bottom: 12px; }
  .field label {
    display: block; font-size: 11px; font-weight: 700;
    color: var(--accent); margin-bottom: 5px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .field input {
    width: 100%; padding: 12px 14px;
    border: 2px solid var(--border); border-radius: 10px;
    font-size: 15px; font-family: inherit; outline: none;
    background: var(--input-bg); color: var(--text);
  }
  .field input:focus { border-color: var(--accent-dark); }
  
  .btn-primary {
    padding: 13px 18px;
    background: var(--accent); color: white;
    border: 2px solid var(--accent-dark); border-radius: 10px;
    font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    transition: all 0.15s;
  }
  .btn-primary.full { width: 100%; margin-top: 6px; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .alert {
    padding: 9px 12px; border-radius: 10px;
    font-size: 13px; margin-bottom: 10px; display: none;
    border: 1px solid var(--accent);
    background: var(--accent-light); color: var(--accent);
  }
  .alert.show { display: block; }
  
  /* HEADER */
  .header {
    background: var(--card); border-bottom: 2px solid var(--border);
    padding: 12px 14px; display: flex;
    align-items: center; gap: 10px;
    min-height: 54px; z-index: 10;
    flex-shrink: 0;
  }
  .header-title { font-size: 18px; font-weight: 700; flex: 1; color: var(--text); }
  .header-btn {
    background: var(--accent); border: 2px solid var(--accent-dark);
    cursor: pointer; padding: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-family: inherit;
    width: 34px; height: 34px; font-size: 22px; font-weight: 700;
    flex-shrink: 0;
  }
  .header-btn:hover { background: var(--accent-dark); }
  
  /* LISTS */
  .list-screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--card); min-height: 0; }
  .scroll-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .section-label {
    padding: 9px 14px; font-size: 11px; font-weight: 700;
    color: var(--accent); text-transform: uppercase;
    letter-spacing: 0.8px; background: var(--section-bg);
    border-top: 1px solid var(--border-soft);
    border-bottom: 1px solid var(--border-soft);
  }
  .row {
    display: flex; align-items: center;
    padding: 11px 14px; gap: 12px;
    cursor: pointer; border-bottom: 1px solid var(--border-soft);
    background: var(--card);
    min-height: 60px;
  }
  .row.no-click { cursor: default; }
  .row:not(.no-click):hover { background: var(--hover); }
  
  .avatar {
    width: 44px; height: 44px; border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 17px;
    flex-shrink: 0; border: 2px solid var(--border);
  }
  .row-info { flex: 1; min-width: 0; }
  .row-name {
    font-size: 14.5px; font-weight: 600; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: flex; align-items: center; gap: 6px;
    color: var(--text);
  }
  .row-sub {
    font-size: 12.5px; color: var(--text-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .row-time { font-size: 10.5px; color: var(--text-soft); }
  
  .bot-tag {
    background: var(--accent); color: white;
    font-size: 9px; font-weight: 800;
    padding: 1px 5px; border-radius: 4px;
    letter-spacing: 0.5px;
    border: 1px solid var(--accent-dark);
  }
  
  .empty-state { padding: 40px 22px; text-align: center; color: var(--text-soft); }
  .empty-state .emoji { font-size: 44px; margin-bottom: 10px; }
  .empty-state-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .empty-state-text { font-size: 13px; line-height: 1.5; }
  
  /* TAB BAR */
  .tab-bar {
    display: flex; background: var(--card);
    border-top: 2px solid var(--border); padding: 5px 0 6px;
    flex-shrink: 0;
    padding-bottom: max(6px, env(safe-area-inset-bottom));
  }
  .tab {
    flex: 1; background: transparent; border: none;
    padding: 5px; cursor: pointer; position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: var(--text-soft); font-family: inherit;
    font-size: 10.5px; font-weight: 600;
  }
  .tab.active { color: var(--accent); }
  .tab .icon { font-size: 21px; line-height: 1; }
  .tab-badge {
    position: absolute; top: 0; right: calc(50% - 22px);
    background: var(--accent); color: white;
    font-size: 10px; font-weight: 700;
    padding: 1px 5px; border-radius: 10px;
    min-width: 18px; text-align: center;
    border: 2px solid var(--card);
  }
  
  /* CHAT */
  .chat-screen {
    position: absolute; inset: 0;
    background: var(--chat-bg);
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.25s ease-out;
    z-index: 20;
  }
  .chat-screen.open { transform: translateX(0); }
  
  .chat-header {
    background: var(--card);
    border-bottom: 2px solid var(--border);
    padding: 9px 10px; display: flex;
    align-items: center; gap: 10px; min-height: 54px;
    flex-shrink: 0;
  }
  .back-btn {
    width: 36px; height: 36px; border: none;
    background: transparent; cursor: pointer; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: var(--accent); font-family: inherit;
    font-weight: 700;
    flex-shrink: 0;
  }
  .back-btn:hover { background: var(--hover); }
  .chat-avatar { width: 36px; height: 36px; border-radius: 12px; font-size: 14px; }
  .chat-name-block { flex: 1; min-width: 0; }
  .chat-name {
    font-size: 15px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: flex; align-items: center; gap: 6px;
    color: var(--text);
  }
  .chat-handle { font-size: 11.5px; color: var(--text-soft); }
  
  .messages {
    flex: 1; overflow-y: auto; padding: 14px 10px;
    display: flex; flex-direction: column; gap: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .msg-row { display: flex; max-width: 100%; align-items: flex-end; gap: 6px; }
  .msg-row.mine { justify-content: flex-end; }
  .msg-avatar { width: 34px; height: 34px; border-radius: 11px; font-size: 13px; flex-shrink: 0; }
  .bubble-wrap { display: flex; flex-direction: column; max-width: 72%; }
  .msg-row.mine .bubble-wrap { align-items: flex-end; }
  .msg-row.theirs .bubble-wrap { align-items: flex-start; }
  
  .bubble {
    padding: 9px 13px; border-radius: 17px;
    font-size: 14.5px; line-height: 1.4;
    word-wrap: break-word; overflow-wrap: anywhere;
    white-space: pre-wrap;
    border: 2px solid var(--border);
  }
  .msg-row.mine .bubble {
    background: var(--bubble-mine);
    color: var(--bubble-mine-text);
    border-bottom-right-radius: 4px;
  }
  .msg-row.theirs .bubble {
    background: var(--bubble-theirs);
    color: var(--bubble-theirs-text);
    border-bottom-left-radius: 4px;
  }
  .msg-time {
    font-size: 10px; color: var(--text);
    opacity: 0.7; margin: 2px 6px 0;
  }
  .day-divider {
    text-align: center; margin: 12px 0 8px;
    font-size: 11px;
  }
  .day-divider span {
    background: var(--accent); color: white;
    padding: 4px 12px; border-radius: 12px;
    border: 1px solid var(--accent-dark);
    font-weight: 600;
  }
  
  .typing-indicator {
    display: flex; gap: 4px; padding: 12px 14px;
    background: var(--bubble-theirs); border-radius: 17px;
    border-bottom-left-radius: 4px; width: fit-content;
    border: 2px solid var(--border);
  }
  .typing-indicator span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); animation: bounce 1.2s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-5px); opacity: 1; }
  }
  
  .composer {
    background: var(--card); border-top: 2px solid var(--border);
    padding: 7px 9px; display: flex; gap: 7px; align-items: flex-end;
    flex-shrink: 0;
    padding-bottom: max(7px, env(safe-area-inset-bottom));
  }
  .composer textarea {
    flex: 1; border: 2px solid var(--border);
    border-radius: 18px; padding: 8px 13px;
    font-size: 15px; font-family: inherit;
    resize: none; outline: none;
    max-height: 100px; min-height: 36px; line-height: 1.3;
    background: var(--input-bg); color: var(--text);
  }
  .composer textarea:focus { border-color: var(--accent-dark); }
  .send-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent); color: white;
    border: 2px solid var(--accent-dark);
    cursor: pointer; font-size: 17px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
  }
  .send-btn:disabled { background: var(--text-soft); border-color: var(--text-soft); }
  .send-btn:not(:disabled):hover { background: var(--accent-dark); }
  .send-btn:not(:disabled):active { transform: scale(0.92); }
  
  /* PROFILE */
  .profile-screen { flex: 1; overflow-y: auto; background: var(--bg); -webkit-overflow-scrolling: touch; }
  .profile-header {
    background: linear-gradient(180deg, #DC2626 0%, #7F1D1D 100%);
    padding: 28px 18px 22px; color: white;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .profile-avatar {
    width: 76px; height: 76px; border-radius: 22px;
    font-size: 32px; border: 4px solid rgba(255,255,255,0.4);
  }
  .profile-name-row { display: flex; align-items: center; gap: 8px; }
  .profile-name { font-size: 20px; font-weight: 700; }
  .edit-icon {
    background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.5);
    color: white;
    width: 26px; height: 26px; border-radius: 50%;
    cursor: pointer; font-size: 12px; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
  }
  .edit-icon:hover { background: rgba(255,255,255,0.4); }
  .profile-handle { font-size: 13px; opacity: 0.9; }
  .profile-bio {
    font-size: 13px;
    color: rgba(255,255,255,0.95);
    text-align: center;
    max-width: 280px;
    line-height: 1.4;
    margin-top: 4px;
    padding: 7px 13px;
    background: rgba(0,0,0,0.2);
    border-radius: 11px;
    border: 1px solid rgba(255,255,255,0.3);
    word-wrap: break-word;
  }
  .profile-bio.empty { display: none; }
  .profile-section {
    background: var(--card); margin-top: 10px;
    border-top: 2px solid var(--border);
    border-bottom: 2px solid var(--border);
  }
  .profile-row {
    padding: 13px 16px; border-bottom: 1px solid var(--border-soft);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px;
    gap: 12px;
  }
  .profile-row:last-child { border-bottom: none; }
  .profile-row .label { color: var(--text-soft); flex-shrink: 0; }
  .profile-row .value { font-weight: 600; color: var(--text); text-align: right; min-width: 0; }
  .profile-row.tappable { cursor: pointer; }
  .profile-row.tappable:hover { background: var(--hover); }
  .bio-value {
    max-width: 65%;
    white-space: normal;
    word-wrap: break-word;
    line-height: 1.3;
  }
  .bio-value.placeholder { color: var(--text-soft); font-weight: 400; font-style: italic; }
  
  .toggle {
    position: relative; width: 46px; height: 26px;
    background: var(--text-soft); border-radius: 13px;
    cursor: pointer; transition: background 0.2s;
    border: 2px solid var(--border);
    flex-shrink: 0;
  }
  .toggle.on { background: var(--accent); }
  .toggle::after {
    content: ''; position: absolute;
    top: 1px; left: 1px;
    width: 18px; height: 18px;
    border-radius: 50%; background: white;
    transition: transform 0.2s;
  }
  .toggle.on::after { transform: translateX(20px); }
  
  .logout-btn {
    width: calc(100% - 28px); margin: 14px; padding: 12px;
    background: var(--card); color: var(--accent);
    border: 2px solid var(--accent);
    border-radius: 11px; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .logout-btn:hover { background: var(--accent); color: white; }
  
  /* SHEET */
  .backdrop {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.6); z-index: 30;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  
  .sheet {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: var(--card); border-radius: 20px 20px 0 0;
    z-index: 31; transform: translateY(100%);
    transition: transform 0.25s ease-out;
    max-height: 85%; display: flex; flex-direction: column;
    border: 2px solid var(--border);
    border-bottom: none;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 38px; height: 4px; background: var(--accent);
    border-radius: 2px; margin: 8px auto 4px;
  }
  .sheet-header {
    padding: 12px 16px 10px;
    display: flex; align-items: center;
    border-bottom: 2px solid var(--border);
  }
  .sheet-title { font-size: 16px; font-weight: 700; flex: 1; color: var(--text); }
  .sheet-close {
    background: transparent; border: 2px solid var(--border);
    color: var(--accent);
    width: 30px; height: 30px; border-radius: 50%;
    font-size: 15px; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
  }
  .sheet-close:hover { background: var(--accent); color: white; }
  .sheet-body { padding: 14px; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
  
  .search-input {
    width: 100%; padding: 11px 13px;
    border: 2px solid var(--border); border-radius: 11px;
    font-size: 14.5px; font-family: inherit; outline: none;
    background: var(--input-bg); color: var(--text);
    margin-bottom: 12px;
  }
  .search-input:focus { border-color: var(--accent-dark); }
  
  .suggestions-list {
    background: var(--card-2);
    border: 2px solid var(--border);
    border-radius: 11px;
    overflow: hidden;
  }
  .suggestion-row {
    display: flex; align-items: center;
    padding: 10px 11px; gap: 11px;
    border-bottom: 1px solid var(--border-soft);
  }
  .suggestion-row:last-child { border-bottom: none; }
  .suggestion-row.bot-row { background: var(--accent-light); }
  .friend-bio {
    font-size: 11.5px;
    color: var(--text-soft);
    margin-top: 2px;
    font-style: italic;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  
  .pill-btn {
    padding: 6px 12px; border: 2px solid transparent; border-radius: 13px;
    font-size: 11.5px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .pill-btn.primary { background: var(--accent); color: white; border-color: var(--accent-dark); }
  .pill-btn.primary:hover { background: var(--accent-dark); }
  .pill-btn.danger { background: var(--card); color: var(--danger); border-color: var(--danger); }
  .pill-btn.danger:hover { background: var(--danger); color: white; }
  .pill-btn.muted { background: transparent; color: var(--text-soft); border-color: var(--border-soft); cursor: default; }
  .btn-group { display: flex; gap: 5px; flex-shrink: 0; }
  
  /* DIALOG */
  .dialog {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.95);
    background: var(--card); border-radius: 16px;
    padding: 22px; width: calc(100% - 36px); max-width: 320px;
    z-index: 32; opacity: 0; pointer-events: none;
    transition: all 0.2s;
    border: 2px solid var(--border);
    box-shadow: var(--shadow-strong);
  }
  .dialog.open {
    opacity: 1; pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }
  .dialog-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
  .dialog-text { font-size: 12.5px; color: var(--text-soft); margin-bottom: 12px; }
  .dialog-input {
    width: 100%; padding: 11px 13px;
    border: 2px solid var(--border); border-radius: 9px;
    font-size: 14.5px; font-family: inherit; outline: none;
    background: var(--input-bg); color: var(--text);
  }
  .dialog-input:focus { border-color: var(--accent-dark); }
  .dialog-actions { display: flex; gap: 7px; margin-top: 12px; }
  .dialog-actions button {
    flex: 1; padding: 10px; border: 2px solid;
    border-radius: 9px; font-size: 13.5px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .dialog-actions .cancel { background: var(--card); color: var(--text-soft); border-color: var(--border-soft); }
  .dialog-actions .confirm { background: var(--accent); color: white; border-color: var(--accent-dark); }
  
  .hidden { display: none !important; }
  
  /* AVATAR COLORS */
  .av-1 { background: #DC2626; }
  .av-2 { background: #F87171; }
  .av-3 { background: #B91C1C; }

<script>
// ============================================================
//  STATE
// ============================================================
const State = {
  currentUser: null,
  activeChat: null,
  friends: [],
  chatPreviews: {},
  inbox: [],
  userCache: {},
  messages: {},     // chatKey -> msg array (in-memory cache)
  pollTimer: null,
  botReplyTimer: null,
  theme: 'dark',
  sentRequests: [], // who I've sent requests to (personal)
  buddyAccepted: false, // has buddy accepted my pending request yet?
};

// ============================================================
//  VIRTUAL USERS (bots/buddies for testing)
// ============================================================
const TESTBOT = {
  username: 'testbot',
  displayName: 'Test Bot',
  bio: '🤖 Auto-accepts · Always replies · Use me to test chats',
  isBot: true,
  autoAccept: true,
};

const BUDDY = {
  username: 'buddy',
  displayName: 'Buddy',
  bio: '👋 Acts like a real friend! I\'ll send you a request and accept yours after a few seconds.',
  isBot: true,
  autoAccept: false,    // doesn't auto-accept; you accept their request from inbox
  sendsInitialRequest: true,  // sends YOU a request when you sign up
  delayedAccept: true,  // accepts your request after a delay
};

const VIRTUAL_USERS = [TESTBOT, BUDDY];
const VIRTUAL_MAP = Object.fromEntries(VIRTUAL_USERS.map(u => [u.username, u]));
function isVirtual(u) { return !!VIRTUAL_MAP[u]; }

// ============================================================
//  STORAGE HELPERS - using localStorage (persists across reloads)
// ============================================================
async function sGet(key, shared = true) {
  try {
    const v = localStorage.getItem('dot:' + key);
    return v;
  } catch { return null; }
}
async function sSet(key, value, shared = true) {
  try {
    localStorage.setItem('dot:' + key, value);
    return { key, value };
  } catch { return null; }
}
async function sList(prefix, shared = true) {
  try {
    const keys = [];
    const fullPrefix = 'dot:' + prefix;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(fullPrefix)) {
        keys.push(k.replace('dot:', ''));
      }
    }
    return keys;
  } catch { return []; }
}

function chatKey(a, b) { return 'chat:' + [a, b].sort().join('|'); }

function hashPass(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; }
  return 'h' + Math.abs(h).toString(36) + '_' + s.length;
}

// Merge messages by (from, t, text), dedupes and sorts. Race-safe.
function mergeMsgs(a, b) {
  const seen = new Set();
  const result = [];
  for (const m of [...(a || []), ...(b || [])]) {
    const id = (m.from || '') + '|' + (m.t || 0) + '|' + (m.text || '');
    if (!seen.has(id)) { seen.add(id); result.push(m); }
  }
  result.sort((x, y) => (x.t || 0) - (y.t || 0));
  return result;
}

async function readAndMergeMessages(key) {
  const raw = await sGet(key);
  let storage = [];
  if (raw) { try { storage = JSON.parse(raw); } catch {} }
  const cached = State.messages[key] || [];
  const merged = mergeMsgs(storage, cached);
  State.messages[key] = merged;
  return merged;
}

async function saveMergedMessages(key, newMsg) {
  if (!State.messages[key]) State.messages[key] = [];
  if (newMsg) State.messages[key].push(newMsg);
  const raw = await sGet(key);
  let storage = [];
  if (raw) { try { storage = JSON.parse(raw); } catch {} }
  const merged = mergeMsgs(storage, State.messages[key]);
  if (merged.length > 500) merged.splice(0, merged.length - 500);
  State.messages[key] = merged;
  await sSet(key, JSON.stringify(merged));
  return merged;
}

// ============================================================
//  USER DATA
// ============================================================
async function getUser(username) {
  if (!username) return null;
  if (State.userCache[username]) return State.userCache[username];
  const raw = await sGet('user:' + username);
  if (raw) {
    try {
      const u = JSON.parse(raw);
      // schema migration / defaults
      if (!u.displayName) u.displayName = u.username;
      if (typeof u.bio !== 'string') u.bio = '';
      State.userCache[username] = u;
      return u;
    } catch {}
  }
  // Virtual user fallback
  if (isVirtual(username)) {
    const v = { ...VIRTUAL_MAP[username], joined: Date.now() };
    State.userCache[username] = v;
    return v;
  }
  return null;
}

async function getFriends(username) {
  const raw = await sGet('friends:' + username);
  if (!raw) return [];
  try { return JSON.parse(raw); } catch { return []; }
}

async function getInbox(username) {
  const raw = await sGet('inbox:' + username);
  if (!raw) return [];
  try { return JSON.parse(raw); } catch { return []; }
}

async function getSentRequests() {
  const raw = await sGet('sentRequests:' + State.currentUser.username, false);
  if (!raw) return [];
  try { return JSON.parse(raw); } catch { return []; }
}

async function setSentRequests(arr) {
  await sSet('sentRequests:' + State.currentUser.username, JSON.stringify(arr), false);
  State.sentRequests = arr;
}

async function getAllUsernames() {
  // Source 1: Read the global user registry (most reliable)
  let usernames = [];
  const registryRaw = await sGet('__user_registry__');
  if (registryRaw) {
    try { usernames = JSON.parse(registryRaw); } catch {}
  }
  
  // Source 2: Also list by prefix as a backup (fills in any users missed from the registry)
  const keys = await sList('user:');
  for (const k of keys) {
    const u = k.replace('user:', '');
    if (!usernames.includes(u)) usernames.push(u);
  }
  
  // Always include virtual users
  for (const v of VIRTUAL_USERS) {
    if (!usernames.includes(v.username)) usernames.push(v.username);
  }
  
  return usernames;
}

async function registerUserInRegistry(username) {
  // Read current registry, append, save back (race-safe-ish with merge)
  const raw = await sGet('__user_registry__');
  let registry = [];
  if (raw) { try { registry = JSON.parse(raw); } catch {} }
  if (!registry.includes(username)) {
    registry.push(username);
    await sSet('__user_registry__', JSON.stringify(registry));
  }
}

// ============================================================
//  THEME
// ============================================================
async function loadTheme() {
  const t = await sGet('app_theme', false);
  State.theme = (t === 'light') ? 'light' : 'dark';
  applyTheme();
}
function applyTheme() {
  if (State.theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
  const toggle = document.getElementById('themeToggle');
  if (toggle) toggle.classList.toggle('on', State.theme === 'dark');
}
async function toggleTheme() {
  State.theme = State.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  await sSet('app_theme', State.theme, false);
}

// ============================================================
//  ENSURE VIRTUAL USERS EXIST
// ============================================================
async function ensureVirtualUsersExist() {
  for (const v of VIRTUAL_USERS) {
    // Always register in the user registry
    await registerUserInRegistry(v.username);
    
    const existing = await sGet('user:' + v.username);
    if (existing) {
      // Update displayName/bio if changed in code
      try {
        const u = JSON.parse(existing);
        let changed = false;
        if (u.displayName !== v.displayName) { u.displayName = v.displayName; changed = true; }
        if (u.bio !== v.bio) { u.bio = v.bio; changed = true; }
        if (changed) await sSet('user:' + v.username, JSON.stringify(u));
      } catch {}
      continue;
    }
    const data = {
      username: v.username,
      displayName: v.displayName,
      bio: v.bio,
      passHash: hashPass('___virtual_' + Math.random()),
      joined: Date.now(),
      isBot: true,
    };
    await sSet('user:' + v.username, JSON.stringify(data));
    await sSet('friends:' + v.username, JSON.stringify([]));
    await sSet('inbox:' + v.username, JSON.stringify([]));
  }
}

// ============================================================
//  BUDDY: Send YOU a request (so you can test inbox/accept)
// ============================================================
async function ensureBuddyHasRequestedMe() {
  const me = State.currentUser.username;
  
  // If buddy is already my friend, do nothing
  const myFriends = await getFriends(me);
  if (myFriends.includes(BUDDY.username)) return;
  
  // If I've already sent buddy a request, do nothing
  const sent = await getSentRequests();
  if (sent.includes(BUDDY.username)) return;
  
  // If buddy has already sent me a request (in my inbox), do nothing
  const myInbox = await getInbox(me);
  if (myInbox.find(r => r.from === BUDDY.username)) return;
  
  // Send buddy → me request
  myInbox.push({ from: BUDDY.username, t: Date.now() });
  await sSet('inbox:' + me, JSON.stringify(myInbox));
}

// Buddy auto-accepts requests from real users after a delay (simulates a person)
async function processBuddyDelayedAccept() {
  const me = State.currentUser.username;
  const sent = await getSentRequests();
  if (!sent.includes(BUDDY.username)) return;
  
  const myFriends = await getFriends(me);
  if (myFriends.includes(BUDDY.username)) return; // already friends
  
  // Has the request been pending long enough? Use sentAt timestamp
  const sentAtRaw = await sGet('buddyRequestAt:' + me, false);
  if (!sentAtRaw) {
    await sSet('buddyRequestAt:' + me, String(Date.now()), false);
    return;
  }
  const sentAt = parseInt(sentAtRaw, 10);
  if (Date.now() - sentAt < 4000) return; // wait 4 seconds
  
  // Buddy accepts!
  if (!myFriends.includes(BUDDY.username)) myFriends.push(BUDDY.username);
  await sSet('friends:' + me, JSON.stringify(myFriends));
  
  // Remove from sent requests
  const newSent = sent.filter(u => u !== BUDDY.username);
  await setSentRequests(newSent);
  
  // Send a welcome message from buddy
  const key = chatKey(me, BUDDY.username);
  const existingChat = await sGet(key);
  if (!existingChat) {
    const welcome = {
      from: BUDDY.username,
      text: `Hey ${State.currentUser.displayName}! Just accepted your request 😊 Thanks for adding me! Send me anything and I'll reply.`,
      t: Date.now(),
    };
    await saveMergedMessages(key, welcome);
  }
  
  await sSet('buddyRequestAt:' + me, '', false);
}

// ============================================================
//  BOT REPLIES
// ============================================================
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function botResponse(message, who) {
  const lower = message.toLowerCase().trim();
  
  if (who === BUDDY.username) {
    if (/^(hi|hello|hey|yo|sup|hola|howdy)\b/.test(lower))
      return pick(["Hey!! 👋","Hi friend!","Yo what's up?","Hey :)"]);
    if (/how (are|r) (you|u|ya)/.test(lower))
      return "I'm good! Just hanging out. You?";
    if (lower.includes('test'))
      return "Yep, the friend system works! Try adding more accounts to test more.";
    if (/(thank|thanks|ty)/.test(lower))
      return "Of course! 💛";
    if (/^(bye|cya|gn|night)/.test(lower))
      return "Talk later! 👋";
    return pick([
      "Nice 😄",
      "Cool, tell me more!",
      "Haha sounds good",
      "I'm just chillin' over here",
      `"${message.slice(0,50)}${message.length>50?'…':''}" — got it!`,
      "What else is new?",
    ]);
  }
  
  // testbot
  if (/^(hi|hello|hey|yo|sup|hola|howdy)\b/.test(lower))
    return pick(["Hey there! 👋","Hi! Nice to meet you.","Hello! How's it going?","Hey! 😊"]);
  if (/how (are|r) (you|u|ya)/.test(lower))
    return "Doing great — just chilling in browser storage 🤖 You?";
  if (lower.includes('test'))
    return "✅ Chat system works! Try adding 'buddy' to test the friend request flow with inbox & accept.";
  if (lower.includes('friend') || lower.includes('buddy'))
    return "Want to test friend requests? Add 'Buddy' from the + menu — they act like a real user (request goes to your inbox, accept it, then chat).";
  if (lower.includes('inbox'))
    return "The Inbox shows incoming friend requests. Try adding Buddy — they'll send you a request right away.";
  if (lower.includes('name'))
    return "Change your display name from the Me tab — tap ✎ next to your name.";
  if (lower.includes('bio'))
    return "Set a bio from the Me tab — tap the Bio row. Others will see it when they search for you.";
  if (lower.includes('theme') || lower.includes('dark') || lower.includes('light'))
    return "Toggle dark mode from the Me tab! Both themes use red outlines.";
  if (lower.includes('bot'))
    return "Yep 🤖 I'm the auto-accept testbot. Buddy is the slow-accept testbot. Together we let you test everything!";
  if (/^(bye|cya|gn|night)/.test(lower))
    return "Bye! 👋";
  if (/(thank|thanks|ty)/.test(lower))
    return "You're welcome! 😊";
  if (lower.includes('?'))
    return pick([
      "Try asking about 'friends', 'inbox', 'theme', 'name', or 'bio'.",
      "I respond to keywords: test, friend, inbox, theme, name, bio, bot.",
    ]);
  return pick([
    "Got your message! ✓",
    `You said: "${message.slice(0,60)}${message.length>60?'…':''}" — stored.`,
    "Cool, I'm reading 👀",
    "Try asking me about 'friends', 'inbox', or 'bio'!",
  ]);
}

async function triggerBotReply(targetUser, userMessage) {
  if (State.botReplyTimer) clearTimeout(State.botReplyTimer);
  showTyping(true);
  const delay = 700 + Math.random() * 800;
  State.botReplyTimer = setTimeout(async () => {
    showTyping(false);
    const reply = botResponse(userMessage, targetUser);
    const key = chatKey(State.currentUser.username, targetUser);
    const newMsg = { from: targetUser, text: reply, t: Date.now() };
    await saveMergedMessages(key, newMsg);
    if (State.activeChat && State.activeChat.username === targetUser) {
      renderMessages(State.messages[key], true);
    }
  }, delay);
}

function showTyping(show) {
  const container = document.getElementById('messages');
  let typing = document.getElementById('typingRow');
  if (show) {
    if (!typing && State.activeChat && isVirtual(State.activeChat.username)) {
      const u = State.activeChat.username;
      const avClass = u === BUDDY.username ? 'av-buddy' : 'av-bot';
      const letter = u === BUDDY.username ? 'B' : '🤖';
      const div = document.createElement('div');
      div.id = 'typingRow';
      div.className = 'msg-row theirs';
      div.innerHTML = `<div class="avatar msg-avatar ${avClass}">${letter}</div><div class="bubble-wrap"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }
  } else {
    if (typing) typing.remove();
  }
}

// ============================================================
//  AUTH
// ============================================================
let authMode = 'login';

document.querySelectorAll('.auth-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    authMode = tab.dataset.mode;
    document.getElementById('authBtn').textContent = authMode === 'login' ? 'Log in' : 'Create account';
    document.getElementById('displayNameField').classList.toggle('hidden', authMode !== 'signup');
    hideError();
  });
});

function showError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.classList.add('show');
}
function hideError() { document.getElementById('authError').classList.remove('show'); }

document.getElementById('authBtn').addEventListener('click', handleAuth);
['authUser','authDisplayName','authPass'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });
});

async function handleAuth() {
  hideError();
  const username = document.getElementById('authUser').value.trim().toLowerCase();
  const password = document.getElementById('authPass').value;
  const displayName = document.getElementById('authDisplayName').value.trim();
  
  if (!username || !password) return showError('Please enter a username and password.');
  if (!/^[a-z0-9_]{3,20}$/.test(username)) return showError('Username: 3–20 lowercase letters, numbers, or underscores.');
  if (isVirtual(username)) return showError('That username is reserved.');
  if (password.length < 4) return showError('Password must be at least 4 characters.');
  
  const btn = document.getElementById('authBtn');
  btn.disabled = true;
  btn.textContent = '...';
  
  try {
    const userKey = 'user:' + username;
    const existing = await sGet(userKey);
    
    if (authMode === 'signup') {
      if (existing) return showError('That username is already taken.');
      const userData = {
        username,
        displayName: displayName || username,
        bio: '',
        passHash: hashPass(password),
        joined: Date.now(),
      };
      await sSet(userKey, JSON.stringify(userData));
      await sSet('friends:' + username, JSON.stringify([]));
      await sSet('inbox:' + username, JSON.stringify([]));
      await registerUserInRegistry(username);  // Add to global registry
      State.currentUser = userData;
    } else {
      if (!existing) return showError('No account found with that username.');
      const userData = JSON.parse(existing);
      if (userData.passHash !== hashPass(password)) return showError('Incorrect password.');
      // Migrate missing fields
      if (!userData.displayName) userData.displayName = userData.username;
      if (typeof userData.bio !== 'string') userData.bio = '';
      // Make sure existing accounts are in the registry too (heal old data)
      await registerUserInRegistry(username);
      State.currentUser = userData;
    }
    await enterApp();
  } catch (err) {
    console.error(err);
    showError('Something went wrong. Try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = authMode === 'login' ? 'Log in' : 'Create account';
  }
}

async function enterApp() {
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  
  await ensureVirtualUsersExist();
  await ensureBuddyHasRequestedMe();
  
  await refreshAll();
  renderProfile();
  
  // Aggressive polling so messages and friend requests arrive quickly
  if (State.pollTimer) clearInterval(State.pollTimer);
  State.pollTimer = setInterval(pollTick, 1500);
  
  // Refresh immediately when tab becomes visible
  document.addEventListener('visibilitychange', onVisibilityChange);
  window.addEventListener('focus', forceRefresh);
  // Cross-tab sync via localStorage events — INSTANT updates between tabs
  window.addEventListener('storage', onStorageEvent);
}

function onStorageEvent(e) {
  if (!State.currentUser || !e.key || !e.key.startsWith('dot:')) return;
  forceRefresh();
}

async function pollTick() {
  if (!State.currentUser) return;
  try {
    await processBuddyDelayedAccept();
    
    // Always refresh inbox + friends so new requests/friends appear during chats too
    const prevInboxCount = State.inbox.length;
    const prevFriendCount = State.friends.length;
    
    if (State.activeChat) {
      // In chat: load messages AND quietly refresh inbox/friends in parallel
      await Promise.all([
        loadMessages(State.activeChat.username, false),
        quietRefreshInboxAndFriends(),
      ]);
    } else {
      await refreshAll();
    }
    
    // Toast when new request arrives mid-session
    if (State.inbox.length > prevInboxCount) {
      showToast('📥 New friend request!');
    }
    if (State.friends.length > prevFriendCount && !State.activeChat) {
      showToast('🎉 You have a new friend!');
    }
  } catch (err) {
    console.error('poll error', err);
  }
}

async function quietRefreshInboxAndFriends() {
  const me = State.currentUser.username;
  const storageFriends = await getFriends(me);
  const friendSet = new Set(storageFriends);
  for (const f of State.friends) friendSet.add(f);
  State.friends = Array.from(friendSet);
  State.inbox = await getInbox(me);
  
  // Also update chat previews so the list stays fresh
  for (const f of State.friends) {
    const raw = await sGet(chatKey(me, f));
    if (raw) {
      try {
        const msgs = JSON.parse(raw);
        if (msgs.length) {
          const last = msgs[msgs.length - 1];
          State.chatPreviews[f] = {
            lastMsg: last.text,
            lastTime: last.t,
            fromMe: last.from === me,
          };
        }
      } catch {}
    }
  }
  
  updateInboxBadge();
}

function onVisibilityChange() {
  if (document.visibilityState === 'visible') forceRefresh();
}

async function forceRefresh() {
  if (!State.currentUser) return;
  try {
    if (State.activeChat) {
      await loadMessages(State.activeChat.username, true);
      await quietRefreshInboxAndFriends();
    } else {
      await refreshAll();
    }
  } catch {}
}

// Toast notification
function showToast(text) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.style.cssText = `
      position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: white; padding: 10px 16px;
      border-radius: 22px; font-size: 13px; font-weight: 700;
      border: 2px solid var(--accent-dark);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      z-index: 50; pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      opacity: 0;
    `;
    document.getElementById('app').appendChild(toast);
  }
  toast.textContent = text;
  toast.style.opacity = '1';
  toast.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, 2400);
}

async function refreshAll() {
  if (!State.currentUser) return;
  State.userCache = {};
  
  // Load friends — merge storage + local + virtual flags
  const storageFriends = await getFriends(State.currentUser.username);
  const friendSet = new Set(storageFriends);
  for (const f of State.friends) friendSet.add(f);  // keep local additions
  State.friends = Array.from(friendSet);
  
  State.inbox = await getInbox(State.currentUser.username);
  State.sentRequests = await getSentRequests();
  
  // Build chat previews
  const newPreviews = {};
  for (const f of State.friends) {
    const raw = await sGet(chatKey(State.currentUser.username, f));
    if (raw) {
      try {
        const msgs = JSON.parse(raw);
        if (msgs.length) {
          const last = msgs[msgs.length - 1];
          newPreviews[f] = {
            lastMsg: last.text,
            lastTime: last.t,
            fromMe: last.from === State.currentUser.username,
          };
        }
      } catch {}
    }
  }
  State.chatPreviews = { ...State.chatPreviews, ...newPreviews };
  
  await renderFriends();
  await renderInbox();
  updateInboxBadge();
  document.getElementById('profileFriendCount').textContent = State.friends.length;
}

function avatarClass(user) {
  if (user.username === BUDDY.username) return 'av-buddy';
  if (user.username === TESTBOT.username) return 'av-bot';
  if (user.isBot) return 'av-bot';
  let h = 0;
  const name = user.username || user || '';
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return 'av-' + (Math.abs(h) % 8 + 1);
}

function avatarLetter(user) {
  if (user.username === TESTBOT.username) return '🤖';
  if (user.username === BUDDY.username) return 'B';
  const name = (user.displayName || user.username || user || '?');
  return (name[0] || '?').toUpperCase();
}

async function renderFriends() {
  const list = document.getElementById('friendsList');
  if (State.friends.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <div class="emoji">👥</div>
      <div class="empty-state-title">No friends yet</div>
      <div class="empty-state-text">
        Tap the <strong style="color:var(--accent);">+</strong> in the top right to find people to add.
        ${State.inbox.length > 0 ? `<br/><br/>You have <strong style="color:var(--accent);">${State.inbox.length}</strong> friend request${State.inbox.length === 1 ? '' : 's'} waiting in your Inbox 📥` : ''}
      </div>
    </div>`;
    return;
  }
  
  const sorted = [...State.friends].sort((a, b) => {
    const pa = State.chatPreviews[a], pb = State.chatPreviews[b];
    if (pa && pb) return pb.lastTime - pa.lastTime;
    if (pa) return -1;
    if (pb) return 1;
    return a.localeCompare(b);
  });
  
  const withMsgs = sorted.filter(f => State.chatPreviews[f]);
  const noMsgs = sorted.filter(f => !State.chatPreviews[f]);
  
  let html = '';
  if (withMsgs.length) {
    html += '<div class="section-label">Recent</div>';
    for (const f of withMsgs) html += await friendItemHTML(f);
  }
  if (noMsgs.length) {
    html += '<div class="section-label">Friends</div>';
    for (const f of noMsgs) html += await friendItemHTML(f);
  }
  
  list.innerHTML = html;
  list.querySelectorAll('.row').forEach(el => {
    el.addEventListener('click', () => openChat(el.dataset.user));
  });
}

async function friendItemHTML(username) {
  const user = await getUser(username);
  if (!user) return '';
  const preview = State.chatPreviews[username];
  let previewText = 'Tap to start chatting';
  let timeText = '';
  if (preview) {
    const prefix = preview.fromMe ? 'You: ' : '';
    previewText = prefix + preview.lastMsg;
    if (previewText.length > 40) previewText = previewText.slice(0, 40) + '…';
    timeText = formatPreviewTime(preview.lastTime);
  }
  const tag = user.isBot ? '<span class="bot-tag">BOT</span>' : '';
  return `<div class="row" data-user="${escapeHtml(username)}">
    <div class="avatar ${avatarClass(user)}">${avatarLetter(user)}</div>
    <div class="row-info">
      <div class="row-name">${escapeHtml(user.displayName)}${tag}</div>
      <div class="row-sub">${escapeHtml(previewText)}</div>
    </div>
    <div class="row-meta"><div class="row-time">${timeText}</div></div>
  </div>`;
}

async function acceptRequest(fromUsername) {
  const me = State.currentUser.username;
  
  // Add to my friends
  let myFriends = await getFriends(me);
  if (!myFriends.includes(fromUsername)) myFriends.push(fromUsername);
  await sSet('friends:' + me, JSON.stringify(myFriends));
  
  // Add to their friends
  let theirFriends = await getFriends(fromUsername);
  if (!theirFriends.includes(me)) theirFriends.push(me);
  await sSet('friends:' + fromUsername, JSON.stringify(theirFriends));
  
  // Remove from my inbox
  let inbox = await getInbox(me);
  inbox = inbox.filter(r => r.from !== fromUsername);
  await sSet('inbox:' + me, JSON.stringify(inbox));
  
  // Clean their sent-requests for me
  const theirSentRaw = await sGet('sentRequests:' + fromUsername, false);
  if (theirSentRaw) {
    try {
      let theirSent = JSON.parse(theirSentRaw);
      theirSent = theirSent.filter(u => u !== me);
      await sSet('sentRequests:' + fromUsername, JSON.stringify(theirSent), false);
    } catch {}
  }
  
  // Clean my sent-requests for them
  const mySent = State.sentRequests.filter(u => u !== fromUsername);
  await setSentRequests(mySent);
  
  // Update local state immediately
  if (!State.friends.includes(fromUsername)) State.friends.push(fromUsername);
  State.inbox = State.inbox.filter(r => r.from !== fromUsername);
  
  // If accepting Buddy, send a hello message and open chat
  if (fromUsername === BUDDY.username) {
    const key = chatKey(me, BUDDY.username);
    const existingChat = await sGet(key);
    if (!existingChat) {
      const hello = {
        from: BUDDY.username,
        text: `Yay we're friends! 🎉 Send me anything and I'll reply!`,
        t: Date.now(),
      };
      await saveMergedMessages(key, hello);
    }
  }
  
  await refreshAll();
  
  // Auto-open chat after accepting
  setTimeout(() => openChat(fromUsername), 200);
  switchTab('chats');
}

async function declineRequest(fromUsername) {
  const me = State.currentUser.username;
  let inbox = await getInbox(me);
  inbox = inbox.filter(r => r.from !== fromUsername);
  await sSet('inbox:' + me, JSON.stringify(inbox));
  
  const theirSentRaw = await sGet('sentRequests:' + fromUsername, false);
  if (theirSentRaw) {
    try {
      let theirSent = JSON.parse(theirSentRaw);
      theirSent = theirSent.filter(u => u !== me);
      await sSet('sentRequests:' + fromUsername, JSON.stringify(theirSent), false);
    } catch {}
  }
  
  State.inbox = State.inbox.filter(r => r.from !== fromUsername);
  await refreshAll();
}

async function renderSuggestions(query) {
  const container = document.getElementById('suggestionsContainer');
  const me = State.currentUser.username;
  
  const allUsernames = await getAllUsernames();
  const myFriends = await getFriends(me);
  const myInbox = await getInbox(me);
  const sentRequests = await getSentRequests();
  
  let candidates = allUsernames.filter(u => u !== me);
  
  if (query) {
    const filtered = [];
    for (const u of candidates) {
      const user = await getUser(u);
      if (!user) continue;
      if (u.includes(query) || (user.displayName || '').toLowerCase().includes(query)) {
        filtered.push(u);
      }
    }
    candidates = filtered;
  }
  
  if (candidates.length === 0) {
    container.innerHTML = `<div class="empty-state" style="padding:30px 20px;">
      <div class="emoji">🔍</div>
      <div class="empty-state-title">No matches</div>
      <div class="empty-state-text">Try a different search.</div>
    </div>`;
    return;
  }
  
  let html = `<div style="font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:7px;">${query ? 'Results' : 'People you can add'}</div>`;
  html += '<div class="suggestions-list">';
  
  // Virtual users first, then alphabetical
  candidates.sort((a, b) => {
    if (isVirtual(a) && !isVirtual(b)) return -1;
    if (!isVirtual(a) && isVirtual(b)) return 1;
    return a.localeCompare(b);
  });
  
  for (const username of candidates) {
    const user = await getUser(username);
    if (!user) continue;
    
    const isFriend = myFriends.includes(username);
    const theySentMe = myInbox.find(r => r.from === username);
    const iSentThem = sentRequests.includes(username);
    
    let actionHTML = '';
    if (isFriend) actionHTML = `<button class="pill-btn muted">✓ Friends</button>`;
    else if (theySentMe) actionHTML = `<button class="pill-btn primary" data-act="accept" data-user="${escapeHtml(username)}">Accept</button>`;
    else if (iSentThem) actionHTML = `<button class="pill-btn muted">Pending</button>`;
    else actionHTML = `<button class="pill-btn primary" data-act="add" data-user="${escapeHtml(username)}">Add</button>`;
    
    const tag = user.isBot ? '<span class="bot-tag">BOT</span>' : '';
    const rowClass = user.isBot ? 'suggestion-row bot-row' : 'suggestion-row';
    const bioLine = (user.bio && user.bio.trim()) 
      ? `<div class="friend-bio">${escapeHtml(user.bio.trim())}</div>` 
      : '';
    html += `<div class="${rowClass}">
      <div class="avatar ${avatarClass(user)}">${avatarLetter(user)}</div>
      <div class="row-info">
        <div class="row-name">${escapeHtml(user.displayName)}${tag}</div>
        <div class="row-sub">@${escapeHtml(user.username)}</div>
        ${bioLine}
      </div>
      ${actionHTML}
    </div>`;
  }
  html += '</div>';
  
  container.innerHTML = html;
  container.querySelectorAll('button[data-act]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const act = btn.dataset.act;
      const username = btn.dataset.user;
      btn.disabled = true;
      btn.textContent = '...';
      try {
        if (act === 'add') await sendFriendRequest(username);
        else if (act === 'accept') {
          await acceptRequest(username);
          closeAddFriendSheet();
        }
      } finally {
        const queryNow = document.getElementById('searchInput').value.trim().toLowerCase();
        await renderSuggestions(queryNow);
      }
    });
  });
}

async function sendFriendRequest(targetUsername) {
  const me = State.currentUser.username;
  await ensureVirtualUsersExist();
  
  const target = await getUser(targetUsername);
  if (!target) {
    document.getElementById('searchAlert').innerHTML = `<div class="alert show">User not found.</div>`;
    return;
  }
  
  // Already friends?
  const myFriends = await getFriends(me);
  if (myFriends.includes(targetUsername)) {
    document.getElementById('searchAlert').innerHTML = `<div class="alert show">You're already friends.</div>`;
    return;
  }
  
  // Already in my inbox? Just accept their request instead.
  const myInbox = await getInbox(me);
  if (myInbox.find(r => r.from === targetUsername)) {
    await acceptRequest(targetUsername);
    closeAddFriendSheet();
    return;
  }
  
  // Already sent?
  const sent = await getSentRequests();
  if (sent.includes(targetUsername)) {
    document.getElementById('searchAlert').innerHTML = `<div class="alert show">Request already sent.</div>`;
    return;
  }
  
  // === TESTBOT: auto-accept ===
  if (targetUsername === TESTBOT.username) {
    if (!myFriends.includes(targetUsername)) myFriends.push(targetUsername);
    await sSet('friends:' + me, JSON.stringify(myFriends));
    
    let botFriends = await getFriends(targetUsername);
    if (!botFriends.includes(me)) botFriends.push(me);
    await sSet('friends:' + targetUsername, JSON.stringify(botFriends));
    
    // Welcome message
    const key = chatKey(me, targetUsername);
    const existingChat = await sGet(key);
    if (!existingChat) {
      const welcome = {
        from: targetUsername,
        text: `Hey ${State.currentUser.displayName}! 👋 I'm Test Bot — I auto-accept friend requests so you can chat right away. Try adding 'Buddy' next — they act like a real user (request goes to your inbox).`,
        t: Date.now(),
      };
      await saveMergedMessages(key, welcome);
    }
    
    // Update local state immediately
    if (!State.friends.includes(targetUsername)) State.friends.push(targetUsername);
    State.userCache[targetUsername] = target;
    
    closeAddFriendSheet();
    switchTab('chats');
    await refreshAll();
    setTimeout(() => openChat(targetUsername), 320);
    return;
  }
  
  // === Regular user / Buddy: send request to their inbox ===
  // Read their current inbox, append, save (race-safe via merge attempt)
  const existingInboxRaw = await sGet('inbox:' + targetUsername);
  let theirInbox = [];
  if (existingInboxRaw) { try { theirInbox = JSON.parse(existingInboxRaw); } catch {} }
  if (!theirInbox.find(r => r.from === me)) {
    theirInbox.push({ from: me, t: Date.now() });
    await sSet('inbox:' + targetUsername, JSON.stringify(theirInbox));
  }
  
  // Track in my personal sent-requests
  const newSent = [...sent, targetUsername];
  await setSentRequests(newSent);
  
  // For Buddy: track when sent so they accept after delay
  if (targetUsername === BUDDY.username) {
    await sSet('buddyRequestAt:' + me, String(Date.now()), false);
  }
  
  document.getElementById('searchAlert').innerHTML = 
    `<div class="alert show">✓ Friend request sent to @${escapeHtml(targetUsername)}!${targetUsername === BUDDY.username ? ' Buddy will accept in a few seconds...' : ''}</div>`;
}

async function openChat(username) {

  if (!user) return;
  State.activeChat = { username, displayName: user.displayName };
  document.getElementById('chatName').innerHTML = escapeHtml(user.displayName) + 
    (user.isBot ? ' <span class="bot-tag">BOT</span>' : '');

function closeChat() {
  document.getElementById('chatScreen').classList.remove('open');
  State.activeChat = null;
  if (State.botReplyTimer) { clearTimeout(State.botReplyTimer); State.botReplyTimer = null; }
  refreshAll();
}

async function loadMessages(otherUser, scrollToBottom) {
  const key = chatKey(State.currentUser.username, otherUser);
  const merged = await readAndMergeMessages(key);
  renderMessages(merged, scrollToBottom);
}

function renderMessages(msgs, forceScroll) {
  const container = document.getElementById('messages');
  const wasNearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 80;
  
  if (msgs.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding:40px 20px; color:var(--text);">
      <div style="font-size:42px; margin-bottom:10px;">👋</div>
      <div style="font-size:14px; font-weight:600;">No messages yet — say hi!</div>
    </div>`;
    return;
  }
  
  let html = '';
  let lastDay = '';
  const otherUserData = State.userCache[State.activeChat.username];
  
  msgs.forEach(m => {
    const day = formatDay(m.t);
    if (day !== lastDay) {
      html += `<div class="day-divider"><span>${day}</span></div>`;
      lastDay = day;
    }
    const mine = m.from === State.currentUser.username;
    const time = formatTime(m.t);
    const senderUser = mine ? State.currentUser : (otherUserData || { username: m.from });
    const av = mine ? '' :
      `<div class="avatar msg-avatar ${avatarClass(senderUser)}">${avatarLetter(senderUser)}</div>`;
    html += `<div class="msg-row ${mine ? 'mine' : 'theirs'}">
      ${mine ? `<div class="msg-time">${time}</div>` : av}
      <div class="bubble-wrap"><div class="bubble">${escapeHtml(m.text)}</div></div>
      ${mine ? '' : `<div class="msg-time">${time}</div>`}
    </div>`;
  });
  
  container.innerHTML = html;
  if (forceScroll || wasNearBottom) container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !State.activeChat) return;
  input.value = '';
  autosizeInput();
  document.getElementById('sendBtn').disabled = true;
  
  const otherUser = State.activeChat.username;
  const key = chatKey(State.currentUser.username, otherUser);
  
  // Add to in-memory cache and render immediately
  const newMsg = { from: State.currentUser.username, text, t: Date.now() };
  if (!State.messages[key]) State.messages[key] = [];
  State.messages[key].push(newMsg);
  renderMessages(State.messages[key], true);
  
  // Save with merge
  await saveMergedMessages(key);
  
  // Trigger bot/buddy reply
  if (isVirtual(otherUser)) triggerBotReply(otherUser, text);
}

document.getElementById('backBtn').addEventListener('click', closeChat);
document.getElementById('sendBtn').addEventListener('click', sendMessage);

const msgInput = document.getElementById('msgInput');
msgInput.addEventListener('input', () => {
  document.getElementById('sendBtn').disabled = msgInput.value.trim().length === 0;
  autosizeInput();
});
msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
function autosizeInput() {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 100) + 'px';
}

// ============================================================
//  TABS
// ============================================================
function switchTab(which) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === which));
  document.getElementById('chatsTab').classList.toggle('hidden', which !== 'chats');
  document.getElementById('inboxTab').classList.toggle('hidden', which !== 'inbox');
  document.getElementById('profileTab').classList.toggle('hidden', which !== 'profile');
  if (which === 'chats' || which === 'inbox') refreshAll();
  if (which === 'profile') renderProfile();
}
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchTab(t.dataset.tab));
});

// ============================================================
//  PROFILE
// ============================================================
function renderProfile() {
  const u = State.currentUser;
  document.getElementById('profileName').textContent = u.displayName;
  document.getElementById('profileHandle').textContent = '@' + u.username;
  document.getElementById('profileDisplayName').textContent = u.displayName;
  document.getElementById('profileUsername').textContent = '@' + u.username;
  document.getElementById('profileJoined').textContent = new Date(u.joined)
    .toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
  document.getElementById('profileFriendCount').textContent = State.friends.length;
  
  const headerBio = document.getElementById('profileHeaderBio');
  const bioText = (u.bio || '').trim();
  if (bioText) {
    headerBio.textContent = bioText;
    headerBio.classList.remove('empty');
  } else {
    headerBio.textContent = '';
    headerBio.classList.add('empty');
  }
  
  const bioVal = document.getElementById('profileBio');
  if (bioText) {
    bioVal.textContent = bioText;
    bioVal.classList.remove('placeholder');
  } else {
    bioVal.textContent = 'Tap to add bio';
    bioVal.classList.add('placeholder');
  }
  
  const av = document.getElementById('profileAvatar');
  av.className = 'avatar profile-avatar ' + avatarClass(u);
  av.textContent = avatarLetter(u);
  document.getElementById('themeToggle').classList.toggle('on', State.theme === 'dark');
}

document.getElementById('themeToggle').addEventListener('click', toggleTheme);

  document.getElementById('editNameInput').value = State.currentUser.displayName;
  editDialog.classList.add('open');
  backdrop.classList.add('open');

function closeEditDialog() {

    backdrop.classList.remove('open');

}

document.getElementById('cancelEditBtn').addEventListener('click', closeEditDialog);
document.getElementById('editNameInput').addEventListener('keydown', e => {

document.getElementById('saveEditBtn').addEventListener('click', async () => {

  if (!newName || newName.length > 30) return;
  State.currentUser.displayName = newName;
  await sSet('user:' + State.currentUser.username, JSON.stringify(State.currentUser));

const bioInput = document.getElementById('bioInput');
const bioCharCount = document.getElementById('bioCharCount');

document.getElementById('logoutBtn').addEventListener('click', () => {

  document.removeEventListener('visibilitychange', onVisibilityChange);

  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('authUser').value = '';
  document.getElementById('authPass').value = '';

// ============================================================
//  HELPERS
// ============================================================
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function formatTime(t) {
  const d = new Date(t);
  const h = d.getHours(), m = d.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  return ((h + 11) % 12 + 1) + ':' + String(m).padStart(2, '0') + ' ' + ampm;
}
function formatDay(t) {
  const d = new Date(t), today = new Date();
  const yesterday = new Date(); yesterday.setDate(today.getDate() - 1);
  const sameDay = (a, b) => a.toDateString() === b.toDateString();
  if (sameDay(d, today)) return 'Today';
  if (sameDay(d, yesterday)) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
}
function formatPreviewTime(t) {
  const d = new Date(t), today = new Date();
  if (d.toDateString() === today.toDateString()) return formatTime(t);
  const days = Math.floor((today - d) / 86400000);
  if (days < 7) return d.toLocaleDateString(undefined, { weekday:'short' });
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
}
